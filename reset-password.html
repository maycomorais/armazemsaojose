<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva Contraseña — Admin</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green: #1a7a2e; --green-dark: #155e24; --red: #dc2626;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-400: #9ca3af; --gray-600: #4b5563; --gray-800: #1f2937;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans', sans-serif;
      background: #0f1a12;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
      background-image: radial-gradient(ellipse 80% 60% at 50% -10%, rgba(26,122,46,0.25) 0%, transparent 60%);
    }
    .wrap { width: 100%; max-width: 440px; animation: fadeUp 0.5s ease both; }
    @keyframes fadeUp { from { opacity:0; transform:translateY(24px); } to { opacity:1; transform:translateY(0); } }
    .card {
      background: #fff; border-radius: 20px; padding: 40px 36px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4), 0 0 0 1px rgba(26,122,46,0.15);
    }
    h2 { font-size: 1.35rem; font-weight: 700; color: var(--gray-800); margin-bottom: 6px; letter-spacing: -0.4px; }
    .sub { font-size: 0.85rem; color: var(--gray-600); margin-bottom: 22px; line-height: 1.5; }
    .msg {
      display: none; padding: 12px 14px; border-radius: 8px; font-size: 0.85rem;
      margin-bottom: 16px; line-height: 1.5;
    }
    .msg.error   { background:#fee2e2; color:#7f1d1d; border:1px solid #fca5a5; }
    .msg.success { background:#d1fae5; color:#065f46; border:1px solid #86efac; }
    .msg.info    { background:#dbeafe; color:#1e3a8a; border:1px solid #93c5fd; }
    .form-group { margin-bottom: 16px; }
    .form-group label {
      display: block; font-size: 0.78rem; font-weight: 600; color: var(--gray-600);
      margin-bottom: 6px; letter-spacing: 0.5px; text-transform: uppercase;
    }
    .password-wrap { position: relative; display: flex; align-items: center; }
    .password-wrap input {
      width: 100%; padding: 13px 46px 13px 16px; border: 1.5px solid var(--gray-200);
      border-radius: 10px; font-size: 0.95rem; font-family: 'IBM Plex Sans', sans-serif;
      color: var(--gray-800); background: var(--gray-50); outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
    }
    .password-wrap input:focus {
      border-color: var(--green); background: #fff;
      box-shadow: 0 0 0 3px rgba(26,122,46,0.12);
    }
    .eye-toggle {
      position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; padding: 8px;
      cursor: pointer; color: var(--gray-400); border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s, background 0.15s;
    }
    .eye-toggle:hover { color: var(--green); background: rgba(26,122,46,0.08); }
    .eye-toggle svg { display: block; }

    /* Barra de força */
    .strength { margin-top: 10px; }
    .strength-bar { display: flex; gap: 4px; height: 5px; border-radius: 4px; overflow: hidden; }
    .strength-bar > span { flex: 1; background: var(--gray-200); transition: background .3s; border-radius: 4px; }
    .strength-lbl { font-size: 0.72rem; color: var(--gray-400); margin-top: 6px; min-height: 14px; }

    /* Critérios */
    .criterios {
      list-style: none; margin-top: 12px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px;
    }
    .criterios li { font-size: 0.75rem; color: var(--gray-400); transition: color .25s; }
    .criterios li.ok { color: #22c55e; font-weight: 600; }

    /* Match */
    .match-lbl { font-size: 0.78rem; margin-top: 6px; min-height: 16px; }

    /* Botão principal */
    .btn-salvar {
      width: 100%; padding: 14px; margin-top: 8px;
      background: var(--green); color: #fff; border: none; border-radius: 10px;
      font-size: 0.95rem; font-weight: 700; cursor: pointer;
      font-family: 'IBM Plex Sans', sans-serif; letter-spacing: 0.5px;
      transition: background 0.2s, transform 0.1s;
    }
    .btn-salvar:hover:not(:disabled)  { background: var(--green-dark); }
    .btn-salvar:active:not(:disabled) { transform: scale(0.98); }
    .btn-salvar:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      display:inline-block; width:16px; height:16px;
      border:2px solid rgba(255,255,255,0.3); border-top-color:#fff;
      border-radius:50%; animation:spin 0.7s linear infinite;
      vertical-align:middle; margin-right:6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #loading {
      text-align: center; padding: 30px 0; color: var(--gray-400);
      font-size: 0.9rem;
    }
    #loading .spinner { border-color: var(--gray-200); border-top-color: var(--green); width: 32px; height: 32px; border-width: 3px; display: block; margin: 0 auto 12px; }
  </style>
</head>
<body>

  <div class="wrap">
    <div class="card">
      <h2>Crear Nueva Contraseña</h2>
      <p class="sub">Por seguridad, la nueva contraseña debe cumplir con los siguientes requisitos.</p>

      <div id="msg" class="msg"></div>

      <div id="loading">
        <span class="spinner"></span>
        Verificando enlace...
      </div>

      <div id="form-area" style="display:none">
        <!-- Nueva contraseña -->
        <div class="form-group">
          <label for="nova-senha">Nueva contraseña</label>
          <div class="password-wrap">
            <input type="password" id="nova-senha" placeholder="••••••••"
                   autocomplete="new-password"
                   oninput="avaliarSenha(this.value)">
            <button type="button" class="eye-toggle" onclick="toggleEye('nova-senha', this)"
                    aria-label="Mostrar/ocultar" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>

          <div class="strength">
            <div class="strength-bar">
              <span id="b1"></span><span id="b2"></span><span id="b3"></span><span id="b4"></span><span id="b5"></span>
            </div>
            <div class="strength-lbl" id="forca-lbl"></div>
          </div>

          <ul class="criterios">
            <li id="c1">✗ Mín. 8 caracteres</li>
            <li id="c2">✗ Una minúscula</li>
            <li id="c3">✗ Una mayúscula</li>
            <li id="c4">✗ Un número</li>
            <li id="c5">✗ Un carácter especial</li>
          </ul>
        </div>

        <!-- Confirmar -->
        <div class="form-group">
          <label for="conf-senha">Confirmar contraseña</label>
          <div class="password-wrap">
            <input type="password" id="conf-senha" placeholder="••••••••"
                   autocomplete="new-password"
                   oninput="verificarMatch()">
            <button type="button" class="eye-toggle" onclick="toggleEye('conf-senha', this)"
                    aria-label="Mostrar/ocultar" tabindex="-1">
              <svg class="eye-open" viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="eye-closed" viewBox="0 0 24 24" width="18" height="18" fill="none"
                   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <div class="match-lbl" id="match-lbl"></div>
        </div>

        <button class="btn-salvar" id="btn-salvar" onclick="salvarNovaSenha()" disabled>
          GUARDAR CONTRASEÑA
        </button>
      </div>
    </div>
  </div>

  <script src="supabaseClient.js"></script>
  <script>
  (function () {
    const MSG_EL = document.getElementById('msg');
    let _linkValido = false;

    function showMsg(tipo, texto) {
      MSG_EL.className = 'msg ' + tipo;
      MSG_EL.innerHTML = texto;
      MSG_EL.style.display = 'block';
    }

    // ─── OLHINHO ────────────────────────────────────────────────
    window.toggleEye = function (inputId, btn) {
      const inp = document.getElementById(inputId);
      if (!inp || !btn) return;
      const isPassword = inp.type === 'password';
      inp.type = isPassword ? 'text' : 'password';
      const openIcon   = btn.querySelector('.eye-open');
      const closedIcon = btn.querySelector('.eye-closed');
      if (openIcon)   openIcon.style.display   = isPassword ? 'none'  : 'block';
      if (closedIcon) closedIcon.style.display = isPassword ? 'block' : 'none';
      inp.focus();
    };

    // ─── AVALIAR FORÇA DA SENHA ─────────────────────────────────
    window.avaliarSenha = function (v) {
      v = v || '';
      const checks = [
        v.length >= 8,
        /[a-z]/.test(v),
        /[A-Z]/.test(v),
        /\d/.test(v),
        /[^A-Za-z0-9]/.test(v),
      ];
      const textos   = ['Mín. 8 caracteres','Una minúscula','Una mayúscula','Un número','Un carácter especial'];
      const cores    = ['#e5e7eb','#ef4444','#f97316','#eab308','#22c55e'];
      const labels   = ['','Muy débil 😬','Débil 😐','Aceptable 🙂','Buena 👍','Fuerte 💪'];
      const score    = checks.filter(Boolean).length;

      checks.forEach((ok, i) => {
        const el = document.getElementById('c' + (i + 1));
        if (!el) return;
        el.textContent = (ok ? '✓ ' : '✗ ') + textos[i];
        el.classList.toggle('ok', ok);
      });

      for (let i = 1; i <= 5; i++) {
        const b = document.getElementById('b' + i);
        if (b) b.style.background = i <= score ? cores[score] : '#e5e7eb';
      }
      const fl = document.getElementById('forca-lbl');
      if (fl) { fl.textContent = labels[score]; fl.style.color = cores[score] || '#9ca3af'; }

      window.verificarMatch();
      return score === 5;
    };

    // ─── VERIFICAR MATCH ────────────────────────────────────────
    window.verificarMatch = function () {
      const a   = document.getElementById('nova-senha').value;
      const b   = document.getElementById('conf-senha').value;
      const lbl = document.getElementById('match-lbl');
      const inp = document.getElementById('conf-senha');
      const btn = document.getElementById('btn-salvar');

      const aOk  = window.avaliarSenhaCamposOk || (function(){ return null; })();
      const valido = (function () {
        const checks = [
          a.length >= 8, /[a-z]/.test(a), /[A-Z]/.test(a), /\d/.test(a), /[^A-Za-z0-9]/.test(a),
        ];
        return checks.every(Boolean);
      })();

      const match = a && b && a === b;

      if (!b) {
        lbl.textContent = '';
        lbl.style.color = '';
      } else if (match) {
        lbl.textContent = '✓ Las contraseñas coinciden';
        lbl.style.color = '#22c55e';
      } else {
        lbl.textContent = '✗ Las contraseñas no coinciden';
        lbl.style.color = '#ef4444';
      }
      if (inp && b) inp.style.borderColor = match ? '#22c55e' : (b.length > 0 ? '#ef4444' : '#e5e7eb');

      if (btn) btn.disabled = !(valido && match);
    };

    // ─── SALVAR NOVA SENHA ──────────────────────────────────────
    window.salvarNovaSenha = async function () {
      const nova = document.getElementById('nova-senha').value;
      const conf = document.getElementById('conf-senha').value;
      const btn  = document.getElementById('btn-salvar');

      if (nova.length < 8) { showMsg('error', 'La contraseña debe tener al menos 8 caracteres.'); return; }
      if (!/[a-z]/.test(nova)) { showMsg('error', 'Falta una letra minúscula.'); return; }
      if (!/[A-Z]/.test(nova)) { showMsg('error', 'Falta una letra mayúscula.'); return; }
      if (!/\d/.test(nova))    { showMsg('error', 'Falta un número.'); return; }
      if (!/[^A-Za-z0-9]/.test(nova)) { showMsg('error', 'Falta un carácter especial.'); return; }
      if (nova !== conf) { showMsg('error', 'Las contraseñas no coinciden.'); return; }

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Guardando...';

      try {
        const { error } = await supa.auth.updateUser({ password: nova });
        if (error) {
          showMsg('error', '❌ ' + error.message);
          btn.disabled = false;
          btn.textContent = 'GUARDAR CONTRASEÑA';
          return;
        }

        showMsg('success', '✅ ¡Contraseña actualizada! Redirigiendo al inicio de sesión...');
        setTimeout(async () => {
          try { await supa.auth.signOut(); } catch (_) {}
          window.location.href = 'login.html';
        }, 1800);

      } catch (err) {
        showMsg('error', 'Error inesperado: ' + err.message);
        btn.disabled = false;
        btn.textContent = 'GUARDAR CONTRASEÑA';
      }
    };

    // ─── INICIALIZAÇÃO — detecta o link de recuperação ──────────
    document.addEventListener('DOMContentLoaded', async () => {
      if (typeof supa === 'undefined') {
        document.getElementById('loading').style.display = 'none';
        showMsg('error', 'Error: base de datos no conectada.');
        return;
      }

      // supabase-js v2 dispara 'PASSWORD_RECOVERY' quando detecta o token no URL
      supa.auth.onAuthStateChange((event, session) => {
        if (event === 'PASSWORD_RECOVERY' || (event === 'SIGNED_IN' && session)) {
          _linkValido = true;
          document.getElementById('loading').style.display   = 'none';
          document.getElementById('form-area').style.display = 'block';
          setTimeout(() => document.getElementById('nova-senha')?.focus(), 100);
        }
      });

      // Fallback: PKCE flow (?code=) pode já ter uma sessão válida ao carregar
      const { data: { session } } = await supa.auth.getSession();
      if (session) {
        _linkValido = true;
        document.getElementById('loading').style.display   = 'none';
        document.getElementById('form-area').style.display = 'block';
        setTimeout(() => document.getElementById('nova-senha')?.focus(), 100);
        return;
      }

      // Aguarda 3s — se nada disparar, o link está inválido/expirado
      setTimeout(() => {
        if (!_linkValido) {
          document.getElementById('loading').style.display = 'none';
          showMsg('error',
            '❌ Enlace inválido o expirado.<br><br>' +
            '<a href="login.html" style="color:#1a7a2e;font-weight:700;text-decoration:underline">' +
            'Solicitar un nuevo enlace</a>'
          );
        }
      }, 3000);
    });
  })();
  </script>
</body>
</html>
